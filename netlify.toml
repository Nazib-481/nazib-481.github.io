# Netlify configuration for MD Nazibul Islam Nazib's Portfolio

[build]
  publish = "."

# Redirect /index.html to clean URL
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Custom headers for performance & security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
